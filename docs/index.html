<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Incident Response Health Dashboard</title>
<style>
:root{--navy:#101828;--blue:#145fe4;--blue50:#edf4ff;--ink:#1d1d21;--muted:#667085;--line:#e5e7eb;--fog:#f6f7f9;--red:#d92d20;--amber:#d97706;--green:#078a62;--purple:#7a5af8;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--fog);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}.top{background:var(--navy);color:#fff;padding:22px 28px 20px}.brand{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;max-width:1240px;margin:auto}.eyebrow{color:#94c2ff;font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase}.title{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:4px 0}.subtitle{color:#c9d2e3}.nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1240px;margin:22px auto 0}.nav button{border:1px solid #475467;background:transparent;color:#e5e7eb;border-radius:999px;padding:8px 13px;cursor:pointer}.nav button.active,.nav button:hover{background:#fff;color:var(--navy)}main{max-width:1240px;margin:22px auto;padding:0 18px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.controls select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;color:var(--ink)}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted)}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.kpi .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:750}.kpi .value{font-size:30px;font-weight:850;margin-top:5px;letter-spacing:-.04em}.kpi .hint{color:var(--muted);font-size:11px;margin-top:3px}.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}.blue{color:var(--blue)}.two{grid-template-columns:1.25fr .75fr}.section-title{font-size:16px;font-weight:800;margin:0 0 12px}.bars{display:grid;gap:11px}.barrow{display:grid;grid-template-columns:62px 1fr 54px;align-items:center;gap:10px;font-size:12px}.bar{height:10px;background:#eef0f3;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:var(--blue)}.fill.red{background:var(--red)}.fill.purple{background:var(--purple)}.fill.green{background:var(--green)}.table-wrap{overflow:auto}.table{width:100%;min-width:800px;border-collapse:collapse}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;background:#fafafa}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table td:nth-child(2){white-space:normal;min-width:230px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:var(--blue50);color:var(--blue)}.badge.red{background:#fff0ee}.badge.amber{background:#fff7e8}.badge.green{background:#eafaf3}.footer{color:var(--muted);font-size:11px;text-align:center;padding:22px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.brand{display:block}.kpis,.two{grid-template-columns:1fr}.title{font-size:24px}main{padding:0 12px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div><div class="eyebrow">Incident Response · Operational Excellence</div><div class="title">Incident Response Health</div><div class="subtitle">Severity-based review of incidents, retrospectives, and follow-up work</div></div><div class="pill">Synthetic demo data</div></div><div class="nav" id="nav"></div></header>
<main>
  <div class="controls"><select id="window"><option>Last 7 days</option><option selected>Last 30 days</option><option>Last 90 days</option></select><select id="severity"><option>All severities</option><option>SEV1</option><option>SEV2</option><option>SEV3</option><option>SEV4</option></select><select id="team"><option>All teams</option><option>Data Platform</option><option>Core Services</option></select><span class="pill">Updated: 2026-10-30</span></div>
  <section id="app"></section>
  <div class="footer">Public showcase only. Operational exports and internal URLs should remain private.</div>
</main>
<script>
const data={summary:{incident_count:12,active_incident_count:3,mttm_minutes:48,open_action_count:18,unassigned_action_count:4,retro_overdue_count:5,incidents_without_follow_up:2},mttm:[['SEV1',22,22],['SEV2',31,45],['SEV3',54,1440],['SEV4',78,10080]],incidents:[['1747','Datalake refresh failure','SEV2','Resolved',31,'Pending','IR-521',8],['1753','Potential privilege escalation','SEV1','Mitigated',22,'Complete','IR-528',5],['1790','ARR model timeout','SEV3','Active',null,'Not due','IR-555',2],['1806','Stale Marketo ingestion','SEV3','Resolved',77,'Pending','IR-578',14]],actions:[['DATA-3018','Add freshness policies to ingestion assets','1806','IR-578','New','High','Unassigned',21],['DATA-1504','Modify deployment alert policies','1806','IR-578','Doing','Medium','A. Patel',18],['IDZ-338','Remove UUID uniqueness vector','1753','IR-528','New','Critical','M. Chen',6],['DATA-3828','Investigate run launch failures','1790','Unmatched','New','Medium','Unassigned',4]]};
const nav=['Incident Response','Incident Retros','Incident Action Items','Leadership View','Greatest Hits'];let active='Incident Response';
function navHtml(){document.querySelector('#nav').innerHTML=nav.map(x=>`<button class="${x===active?'active':''}" onclick="setView('${x}')">${x}</button>`).join('')}
function setView(x){active=x;navHtml();render()}
function metric(label,value,hint,cls=''){return `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="hint">${hint}</div></div>`}
function bars(){let max=Math.max(...data.mttm.map(x=>x[1]));return data.mttm.map(x=>`<div class="barrow"><b>${x[0]}</b><div class="bar"><div class="fill ${x[1]>x[2]?'red':''}" style="width:${Math.min(100,Math.max(4,x[1]/max*100))}%"></div></div><span>${x[1]} min</span></div>`).join('')}
function badge(text){let cls=text==='Complete'||text==='Done'||text==='Released'?'green':text==='Pending'||text==='High'||text==='Critical'?'amber':'';return `<span class="badge ${cls}">${text}</span>`}
function incidentRows(){return data.incidents.map(x=>`<tr><td><b>FH-${x[0]}</b></td><td>${x[1]}</td><td>${badge(x[2])}</td><td>${x[3]}</td><td>${x[4]==null?'--':x[4]+' min'}</td><td>${badge(x[5])}</td><td><b>${x[6]}</b></td><td>${x[7]}d</td></tr>`).join('')}
function actionRows(){return data.actions.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><b>FH-${x[2]}</b></td><td>${x[3]==='Unmatched'?'<span class="badge red">Unmatched</span>':x[3]}</td><td>${badge(x[4])}</td><td>${badge(x[5])}</td><td class="${x[6]==='Unassigned'?'red':''}">${x[6]}</td><td>${x[7]}d</td></tr>`).join('')}
function render(){let content=`<div class="grid kpis">${metric('Incidents',data.summary.incident_count,'Selected window')}${metric('Active',data.summary.active_incident_count,'Requires attention','red')}${metric('Average MTTM',data.summary.mttm_minutes+' min','Across mitigated incidents','blue')}${metric('Open actions',data.summary.open_action_count,'Jira follow-up work','blue')}${metric('Unassigned',data.summary.unassigned_action_count,'Open actions without owner','amber')}${metric('Retro backlog',data.summary.retro_overdue_count,'Pending or overdue','purple')}</div>`;
if(active==='Incident Response'||active==='Leadership View')content+=`<div class="grid two" style="margin-top:14px"><div class="card"><h2 class="section-title">MTTM by severity</h2><div class="bars">${bars()}</div><div class="legend" style="margin-top:14px"><span><i class="dot" style="background:var(--blue)"></i>Within target</span><span><i class="dot" style="background:var(--red)"></i>Above target</span></div></div><div class="card"><h2 class="section-title">Attention summary</h2><div class="bars"><div class="barrow"><b>SEV1/2</b><div class="bar"><div class="fill red" style="width:40%"></div></div><span>2</span></div><div class="barrow"><b>Retros</b><div class="bar"><div class="fill purple" style="width:72%"></div></div><span>5</span></div><div class="barrow"><b>Follow-up</b><div class="bar"><div class="fill" style="width:35%"></div></div><span>2</span></div></div><p class="subtitle">Start with the largest exception, then drill into the work queue.</p></div></div>`;
if(active==='Incident Response'||active==='Incident Retros')content+=`<div class="card" style="margin-top:14px"><h2 class="section-title">Incident and retrospective queue</h2><div class="table-wrap"><table class="table"><thead><tr><th>Incident</th><th>Summary</th><th>Severity</th><th>Status</th><th>MTTM</th><th>Retro</th><th>Jira Epic</th><th>Age</th></tr></thead><tbody>${incidentRows()}</tbody></table></div></div>`;
if(active==='Incident Action Items'||active==='Leadership View')content+=`<div class="card" style="margin-top:14px"><h2 class="section-title">Action item tracker</h2><div class="table-wrap"><table class="table"><thead><tr><th>Jira issue</th><th>Summary</th><th>Incident</th><th>Epic</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Age</th></tr></thead><tbody>${actionRows()}</tbody></table></div></div>`;
if(active==='Greatest Hits')content+=`<div class="card" style="margin-top:14px"><h2 class="section-title">Greatest Hits</h2><div class="empty">Recurring operational themes can be added here once historical snapshots are available.</div></div>`;
document.querySelector('#app').innerHTML=content}
navHtml();render();
</script>
</body>
</html>
